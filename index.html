<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat de Último Año</title>

  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

  <header>
    <h1>💬 Chat de Último Año</h1>
    <button onclick="logoutUser()" id="logout-btn">Cerrar Sesion</button>
  </header>

  <div id="user-modal">
    <div class="modal-content">
      <h2>Bienvenido, por favor ingresa tu nombre</h2>

      <input
        type="text"
        id="username-input"
        placeholder="Tu nombre..."
      >

      <h3>Elige tu Avatar:</h3>

      <div class="avatars">
        <img class="avatar-option" src="assets/img/Woman free icons designed by Prosymbols Premium.jpeg">
        <img class="avatar-option" src="assets/img/Jomari 2.jpeg">
        <img class="avatar-option" src="assets/img/Minimalistic avatar icon of a brunette girl _ Минималистичная иконка аватар девушки.jpeg">
        <img class="avatar-option" src="assets/img/descarga (1).jpeg">
        <img class="avatar-option" src="assets/img/Women Formal.jpeg">
        <img class="avatar-option" src="assets/img/descarga (2).jpeg">
      </div>

      <button id="start-chat-btn" disabled>
        Entrar al chat
      </button>
    </div>
  </div>

  <div id="chat-container" style="display:none;">
    <div id="messages"></div>

    <div class="input-area">
      <input type="text" id="message-input" placeholder="Escribe un mensaje...">
      <button id="send-btn" disabled>
        Enviar
      </button>
    </div>

  </div>

  <script src="assets/js/app.js"></script>

  <script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
  
  const firebaseConfig = {
    apiKey: "AIzaSyCUV_dIOyzJb9LYq3lFQnSBctbSidc_0Go",
    authDomain: "bings-61532.firebaseapp.com",
    projectId: "bings-61532",
    storageBucket: "bings-61532.firebasestorage.app",
    messagingSenderId: "102563196836",
    appId: "1:102563196836:web:878c7c32a51179a9365b31",
    measurementId: "G-FSXZGZDS7D"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
</script>

</body>
</html>
